name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure CMake
        shell: msys2 {0}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Targets
        shell: msys2 {0}
        run: cmake --build build

      - name: Run Automated Tests
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Package Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist
          Copy-Item build/EnvLauncher.exe -Destination dist/
          Copy-Item README.md -Destination dist/
          Copy-Item config.example.json -Destination dist/
          if (Test-Path LICENSE) { Copy-Item LICENSE -Destination dist/ }
          Compress-Archive -Path dist/* -DestinationPath "EnvLauncher-${{ github.ref_name }}-windows-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EnvLauncher-${{ github.ref_name }}-windows-x64.zip
            build/EnvLauncher.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
